[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqopr-netpulse"
version = "0.1.0"
description = "Internet Quality Monitor and ISP Evidence Reporter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "DQOPR" }]
keywords = ["network", "diagnostics", "internet", "isp", "latency", "packet-loss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
dqopr-netpulse = "dqopr_netpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dqopr_netpulse"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dqopr_netpulse.gui.app"]
disable_error_code = ["misc", "no-any-return", "untyped-decorator"]

[tool.coverage.run]
branch = true
source = ["dqopr_netpulse"]
