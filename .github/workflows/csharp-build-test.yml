name: C# build and test

on:
  workflow_dispatch:
  push:
    branches:
      - csharp-rewrite
    paths:
      - "DQOPR.NetPulse.sln"
      - "Directory.Build.props"
      - "global.json"
      - "src/DQOPR.NetPulse.*/**"
      - "tests/DQOPR.NetPulse.*/**"
      - ".github/workflows/csharp-build-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "DQOPR.NetPulse.sln"
      - "Directory.Build.props"
      - "global.json"
      - "src/DQOPR.NetPulse.*/**"
      - "tests/DQOPR.NetPulse.*/**"
      - ".github/workflows/csharp-build-test.yml"

jobs:
  build-test:
    name: Build and test C# rewrite
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DQOPR.NetPulse.sln

      - name: Build
        run: dotnet build DQOPR.NetPulse.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DQOPR.NetPulse.sln --configuration Release --no-build --logger "trx;LogFileName=csharp-tests.trx"

      - name: Publish WPF app
        run: dotnet publish src/DQOPR.NetPulse.App/DQOPR.NetPulse.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/DQOPR-NetPulse-win-x64

      - name: Run WPF smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "artifacts/DQOPR-NetPulse-win-x64/DQOPR.NetPulse.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable was not found at $exe"
          }

          $evidence = Join-Path $PWD "artifacts/smoke-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $process = Start-Process -FilePath $exe -ArgumentList @("--ci-smoke", "--output", $evidence, "--duration-seconds", "12") -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "WPF smoke test did not finish within 120 seconds"
          }

          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path $evidence "smoke-error.txt"
            if (Test-Path $errorFile) {
              Get-Content $errorFile | Write-Error
            }
            throw "WPF smoke test exited with code $($process.ExitCode)"
          }

          foreach ($required in @("active-monitoring.png", "dashboard.png", "quick-test-complete.png", "history.png", "session-details.png", "reports.png", "settings.png", "activity-log.png", "about.png", "netpulse-smoke.sqlite3", "measurements-export.json", "smoke_metadata.json")) {
            $path = Join-Path $evidence $required
            if (-not (Test-Path $path)) {
              throw "Smoke evidence missing: $required"
            }
            if ((Get-Item $path).Length -le 0) {
              throw "Smoke evidence is empty: $required"
            }
          }

          foreach ($pattern in @("netpulse-*.csv", "netpulse-*.json", "netpulse-*.html")) {
            $matches = Get-ChildItem -Path $evidence -Filter $pattern
            if (-not $matches) {
              throw "Smoke export missing: $pattern"
            }
            foreach ($file in $matches) {
              if ($file.Length -le 0) {
                throw "Smoke export is empty: $($file.Name)"
              }
            }
          }

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: dqopr-netpulse-csharp-smoke-evidence
          path: artifacts/smoke-evidence
          if-no-files-found: error

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: dqopr-netpulse-csharp-win-x64
          path: artifacts/DQOPR-NetPulse-win-x64
          if-no-files-found: error
